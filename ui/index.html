<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>دورم‌لجر</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F4F6F8;--surface:#FFFFFF;--ink:#152A3A;--muted:#647584;--line:#E1E7EC;--primary:#142C3D;--on-primary:#FFFFFF;--credit:#087F5B;--credit-bg:#E5F6EE;--debt:#C2413B;--debt-bg:#FDECEB;--accent:#2878B5;--accent-bg:#E7F1FA;--focus:#2878B5;--shadow:0 2px 4px rgba(21,42,58,.035),0 12px 32px rgba(21,42,58,.055)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1417;--surface:#13222A;--ink:#E8EFF0;--muted:#93A8AF;--line:#24383F;--primary:#E8EFF0;--on-primary:#0B1417;--credit:#52C79A;--credit-bg:#12332A;--debt:#F08A74;--debt-bg:#3A1F19;--accent:#6CB8D4;--accent-bg:#14303A;--focus:#6CB8D4;--shadow:none}}
:root[data-theme=dark]{--bg:#0B1417;--surface:#13222A;--ink:#E8EFF0;--muted:#93A8AF;--line:#24383F;--primary:#E8EFF0;--on-primary:#0B1417;--credit:#52C79A;--credit-bg:#12332A;--debt:#F08A74;--debt-bg:#3A1F19;--accent:#6CB8D4;--accent-bg:#14303A;--focus:#6CB8D4;--shadow:none}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%}

button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}

.muted{color:var(--muted)}.small{font-size:13px}

.top .who{font-size:13px;color:var(--muted)}

.hero .lbl{font-size:13px;opacity:.75}

.hero .two{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:13px}
.hero .two b{display:block;font-size:15px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{min-height:50px;border-radius:15px;padding:0 16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .15s,box-shadow .15s}.btn.p{box-shadow:0 5px 14px rgba(20,44,61,.13)}.btn.p:hover{box-shadow:0 8px 20px rgba(20,44,61,.18)}
.btn:active{transform:scale(.98)}

nav button[aria-current=page]{color:var(--accent);font-weight:750}nav button[aria-current=page] svg{background:var(--accent-bg);box-sizing:content-box;padding:5px 12px;border-radius:12px;width:20px;height:20px}
nav button[aria-current=page] svg{stroke-width:2.2}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{margin-bottom:16px}
.field label,.lab{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=date],input[type=search],input:not([type]){width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
input.big{font-size:26px;font-weight:700;min-height:60px}
.err{color:var(--debt);font-size:13px;margin-top:4px;display:flex;gap:4px}
.hint{color:var(--muted);font-size:13px;margin-top:4px;min-height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.subbox{margin-top:12px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--accent-bg) 38%,var(--surface))}
.subbox .subt{font-weight:650;font-size:13px;margin-bottom:8px}
.shr{display:flex;align-items:center;gap:8px;padding:6px 0}
.shr span{flex:1}.shr input{width:140px}
.remain{padding:12px;border-radius:12px;font-weight:600;text-align:center;margin-top:8px}
.remain.ok{background:var(--credit-bg);color:var(--credit)}.remain.no{background:var(--debt-bg);color:var(--debt)}.remain.idle{background:var(--accent-bg);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(5,15,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet.full{height:94vh}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet .bd{overflow:auto;padding:8px 16px 16px;flex:1;overscroll-behavior:contain}
.sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;inset-inline:16px;bottom:calc(80px + env(safe-area-inset-bottom,0));max-width:528px;margin:auto;background:var(--primary);color:var(--on-primary);padding:12px 16px;border-radius:14px;z-index:30;font-weight:600}
.toast.bad{background:var(--debt);color:#fff}
.banner{background:var(--debt-bg);color:var(--debt);padding:12px 16px;border-radius:12px;margin-bottom:12px;font-weight:600}
.sk{background:linear-gradient(90deg,var(--line),var(--surface),var(--line));background-size:200% 100%;border-radius:12px;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.big-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.big-c .card{padding:14px 16px}.big-c b{display:block;font-size:17px;margin-top:4px;line-height:1.5}
.brandmark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--accent-bg);color:var(--accent);flex:none}.brandmark svg{width:23px;height:23px}.topbrand{display:flex;align-items:center;gap:11px}.eyebrow{font-size:11px;letter-spacing:.5px;font-weight:800;color:var(--muted);margin-bottom:2px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 9px}.section-head h2{margin:0}.insight{padding:14px 16px;display:flex;align-items:flex-start;gap:12px}.insight-icon{width:36px;height:36px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;flex:none}.insight-icon svg{width:19px;height:19px}.insight .grow{min-width:0;flex:1}.insight b{display:block;font-size:14px}.insight p{font-size:12px;color:var(--muted);margin-top:2px}.period-card{padding:16px;margin-bottom:12px}.period-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.period-total{font-size:23px;font-weight:800;line-height:1.4;margin-top:5px}.delta{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}.delta.up{background:var(--debt-bg);color:var(--debt)}.delta.down{background:var(--credit-bg);color:var(--credit)}.month-bars{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:16px;padding-top:8px}.month-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}.month-col .barv{width:min(100%,26px);min-height:3px;border-radius:7px 7px 3px 3px;background:var(--accent);opacity:.86}.month-col.current .barv{background:var(--primary);opacity:1}.month-col small{font-size:10px;color:var(--muted);white-space:nowrap}.filters{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.filters .field{margin:0;min-width:0}.filters label{font-size:12px;color:var(--muted)}.filters select,.filters input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;padding:0 9px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;min-width:0}.filters .wide{grid-column:1/-1}.result-line{display:flex;justify-content:space-between;align-items:center;margin:10px 2px;color:var(--muted);font-size:12px}.result-line b{color:var(--ink)}
@media(max-width:380px){main{padding-inline:12px}.hero{padding:19px}.hero .big{font-size:29px}.filters{padding:9px;gap:7px}.big-c .card{padding:11px}.period-total{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="nav"></div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('fa-IR');
const nm2=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2});
const fmt=n=>nf.format(n), fm=n=>nm2.format(n/100), toman=n=>fm(n)+' تومان';
const digits=s=>String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٬،,\s\u200c]/g,'');
const pdate=iso=>{try{return new Date(iso+'T12:00:00Z').toLocaleDateString('fa-IR-u-ca-persian',{timeZone:'UTC',month:'long',day:'numeric'})}catch(e){return iso}};
const pdateFull=iso=>{try{return new Date(iso+'T12:00:00Z').toLocaleDateString('fa-IR-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'long',day:'numeric'})}catch(e){return iso}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));
const I={
 home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
 warn:'<path d="M12 4l9 16H3zM12 10v4M12 17h.01"/>'
};
const ic=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+I[n]+'</svg>';
const tg=window.Telegram&&window.Telegram.WebApp;
function initData(){
 try{const t=window.Telegram&&window.Telegram.WebApp;if(t&&t.initData)return t.initData}catch(e){}
 return new URLSearchParams(location.hash.slice(1)).get('tgWebAppData')||'';
}
const S={d:null,tab:'home',loading:true,fatal:null,q:'',fm:'',fc:'',from:'',to:'',min:'',max:'',layer:null};
let F=null;
async function api(path,body){
 let r;
 try{r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Telegram-Init-Data':initData(),'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}
 catch(e){const x=new Error('اتصال به اینترنت یا سرور برقرار نیست. دوباره تلاش کنید.');x.code='network';throw x}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const x=new Error(j.message||'خطای ناشناخته');x.code=j.error||'server';throw x}
 return j;
}
const nm=id=>{const m=S.d.members.find(x=>x.id===id);return m?m.name:'؟'};
const bal=id=>S.d.balances[id]||0;
function toast(msg,bad){const t=$('#toast');t.innerHTML='<div class="toast'+(bad?' bad':'')+'">'+esc(msg)+'</div>';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.innerHTML=''},3200)}
async function load(quiet){
 try{S.d=await api('/api/state');S.fatal=null}
 catch(e){
  if(e.code==='not_member')S.fatal='onboard';
  else if(e.code==='unauthorized')S.fatal='unauth';
  else if(!S.d){S.fatal='error';S.err=e.message}
  else toast(e.message,true);
 }
 S.loading=false;render();
}
/* ---------- views ---------- */
function expItem(e){
 const mine=e.allocs.find(a=>a.m===S.d.me.id);
 const cancelled=e.status!=='active';
 return '<button class="item" data-a="exp" data-id="'+esc(e.id)+'"><div class="grow"><div class="t">'+esc(e.desc)+(cancelled?' <span class="tag d">لغو شده</span>':'')+'</div><div class="m">'+esc(pdate(e.date))+' · '+esc(nm(e.payer))+' پرداخت کرد'+(e.category?' · '+esc(e.category):'')+'</div></div><div style="text-align:end"><div class="amt num"'+(cancelled?' style="text-decoration:line-through;opacity:.6"':'')+'>'+toman(e.total)+'</div>'+(mine&&!cancelled?'<div class="m">سهم شما '+toman(mine.a)+'</div>':'')+'</div></button>';
}
function monthKey(iso){return String(iso||'').slice(0,7)}
function monthLabel(key){try{return new Date(key+'-15T12:00:00Z').toLocaleDateString('fa-IR-u-ca-persian',{month:'short',timeZone:'UTC'})}catch(e){return key}}
function vHome(){
 const d=S.d,me=d.me.id,net=bal(me);
 const toMe=d.plan.filter(p=>p.to===me).reduce((a,p)=>a+p.amount,0),iOwe=d.plan.filter(p=>p.from===me).reduce((a,p)=>a+p.amount,0);
 const tot=toMe+iOwe,cw=tot?Math.round(toMe/tot*100):0;
 const act=d.expenses.filter(e=>e.status==='active');
 const key=monthKey(d.today),prevKey=(()=>{const [y,m]=key.split('-').map(Number);return new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7)})();
 const cur=d.monthly?.[key]||{total:0,count:0},prev=d.monthly?.[prevKey]||{total:0,count:0};
 const delta=prev.total?Math.round((cur.total-prev.total)/prev.total*100):null;
 const months=[];for(let i=5;i>=0;i--){const [y,m]=key.split('-').map(Number),k=new Date(Date.UTC(y,m-1-i,1)).toISOString().slice(0,7);months.push({key:k,...(d.monthly?.[k]||{total:0,count:0})})}
 const maxMonth=Math.max(1,...months.map(m=>m.total));
 let h='<div class="top"><div class="topbrand"><div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19V8l8-4 8 4v11M8 19v-6h8v6M2 20h20M8 8h.01M12 8h.01M16 8h.01"/></svg></div><div><div class="eyebrow">DORMLEDGER · مدیریت مالی</div><button class="roomsw" data-a="rooms" aria-label="تعویض یا مدیریت اتاق‌ها"><h1>'+esc(d.dorm.name)+'</h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="who">سلام '+esc(d.me.name)+'، وضعیت مالی‌ات اینجاست.</div></div></div></div>';

function filteredExp(){
 const q=S.q.trim().toLocaleLowerCase();
 const min=digits(S.min||''),max=digits(S.max||'');
 return S.d.expenses.filter(e=>{
  if(S.fm&&!(e.payer===S.fm||e.allocs.some(a=>a.m===S.fm)))return false;
  if(S.fc&&(e.category||'سایر')!==S.fc)return false;
  if(S.from&&e.date<S.from)return false;
  if(S.to&&e.date>S.to)return false;
  if(min&&Number.isFinite(Number(digits(min)))&&e.total<Number(digits(min))*100)return false;
  if(max&&Number.isFinite(Number(digits(max)))&&e.total>Number(digits(max))*100)return false;
  if(q&&!(e.desc.toLocaleLowerCase().includes(q)||(e.category||'').toLocaleLowerCase().includes(q)||nm(e.payer).toLocaleLowerCase().includes(q)||e.allocs.some(a=>nm(a.m).toLocaleLowerCase().includes(q))))return false;
  return true;
 });
}

function partChips(list){return list.map(m=>'<button class="chip" data-a="fpart" data-id="'+esc(m.id)+'" aria-pressed="'+F.sel.includes(m.id)+'">'+(F.sel.includes(m.id)?ic('check'):'')+esc(m.name)+'</button>').join('')}

function parseDec(s){const t=digits(s).replace(/[٫\/]/g,'.');if(!/^\d+(\.\d{1,2})?$/.test(t))return null;const p=t.split('.');return Number(p[0])*100+Number(((p[1]||'')+'00').slice(0,2))}
function parseAmt(s){const t=digits(s);if(!t)return {e:'مبلغ را وارد کنید'};const n=parseDec(s);if(n===null)return {e:'مبلغ را به‌صورت عدد مثبت (حداکثر ۲ رقم اعشار) وارد کنید'};if(!Number.isSafeInteger(n)||n>1e14)return {e:'مبلغ بیش از حد مجاز است'};if(n<=0)return {e:'مبلغ باید بزرگ‌تر از صفر باشد'};return {v:n}}
function equalSplit(total,ids){const s=[...ids].sort(),b=Math.floor(total/s.length),r=total%s.length;return s.map((id,i)=>({m:id,a:b+(i<r?1:0)}))}
function calc(){
 const err={},a=parseAmt(F.amount);
 if(a.e)err.amount=a.e;
 if(!F.desc.trim())err.desc='شرح را بنویسید';
 let allocs=[],remain=null;
 if(F.method==='equal'){
  if(!F.sel.length)err.parts='حداقل یک نفر را انتخاب کنید';
  else if(a.v){if(a.v<F.sel.length)err.parts='مبلغ برای این تعداد نفر کافی نیست';else allocs=equalSplit(a.v,F.sel)}
 }else{
  let sum=0,cnt=0;
  for(const m of S.d.members.filter(m=>m.active)){const t=digits(F.shares[m.id]||'');if(t===''||Number(t)===0)continue;const n=parseDec(t);if(n===null||n<=0){err.parts='سهم‌ها باید عدد مثبت (حداکثر ۲ رقم اعشار) باشند';continue}sum+=n;cnt++;allocs.push({m:m.id,a:n})}
  if(!cnt&&!err.parts)err.parts='سهم حداقل یک نفر را وارد کنید';
  if(a.v!==undefined){remain=a.v-sum;if(remain!==0&&!err.parts)err.parts=remain>0?'هنوز '+toman(remain)+' تقسیم نشده':'مجموع سهم‌ها '+toman(-remain)+' بیشتر از مبلغ کل است'}
 }
 return {err,total:a.v,allocs,remain,ok:!Object.keys(err).length};
}

}
